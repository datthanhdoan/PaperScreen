# One-off: create the fixed signing keystore on a runner, so no local JDK is needed.
# Prerequisites and steps: docs/signing.md.
name: Generate signing keystore

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Replace an existing KEYSTORE_B64 (installed apps will no longer update!)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
      ADMIN_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - name: Check prerequisites
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Create the KEYSTORE_PASSWORD and KEY_ALIAS secrets first (docs/signing.md)."
            exit 1
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "::error::KEYSTORE_PASSWORD must be at least 12 characters."
            exit 1
          fi
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$OVERWRITE" != "true" ]; then
            echo "::error::KEYSTORE_B64 already exists. Re-run with overwrite only if you really want a new signing key."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        # PKCS12 has a single password, so the key password equals the store password.
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/paperscreen.keystore" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=PaperScreen, O=${GITHUB_REPOSITORY_OWNER}"
          keytool -list -v -keystore "$RUNNER_TEMP/paperscreen.keystore" -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "Alias|SHA256|Valid" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Store as repository secret
        if: env.ADMIN_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          base64 -w0 "$RUNNER_TEMP/paperscreen.keystore" | gh secret set KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          echo "KEYSTORE_B64 secret updated. Delete the SECRETS_ADMIN_TOKEN secret and revoke the token now." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare keystore for manual copy
        if: env.ADMIN_TOKEN == ''
        run: |
          mkdir -p out
          base64 -w0 "$RUNNER_TEMP/paperscreen.keystore" > out/KEYSTORE_B64.txt
          echo "::warning::No SECRETS_ADMIN_TOKEN: download the artifact, paste KEYSTORE_B64.txt into the KEYSTORE_B64 secret, then delete this workflow run."

      - uses: actions/upload-artifact@v7
        if: env.ADMIN_TOKEN == ''
        with:
          name: keystore-b64
          path: out/KEYSTORE_B64.txt
          retention-days: 1
